</head><body>
<header><h1>PDX Simple Flight Data <span style='font-size:12px;color:#607087'>v1.2.7</span></h1><div class="hint">iPhone web app: host this folder, open index.html in Safari, then Share → Add to Home Screen.</div></header>
<main><form id="flightForm" onsubmit="return false">
<section class="card"><h2>Inbound Flight</h2>

<div class="grid two">
  <div class="reqBox">
    <label class="req">Date</label>
    <input id="date" type="date" class="requiredField" data-required>
  </div>
  <div>
    <label>Submitted By</label>
    <input id="submittedBy" class="requiredField" data-required>
  </div>
</div>

<div class="grid compact" style="margin-top:8px">
  <div class="reqBox">
    <label class="req">Airline</label>
    <select id="airline" class="requiredField" data-airline data-required></select>
  </div>
  <div class="reqBox">
    <label class="req">Flight No</label>
    <input id="flightNo" maxlength="4" inputmode="numeric" class="num requiredField" data-required>
  </div>
  <div class="reqBox">
    <label class="req">ETA</label>
    <input id="eta" maxlength="4" inputmode="numeric" class="num requiredField" data-required>
  </div>
  <div>
    <label>TSA Status</label>
    <select id="tsaStatus">
      <option value="">N/A</option>
      <option>OPEN</option>
      <option>CLOSED</option>
    </select>
  </div>
</div>

<div style="margin-top:8px">
  <label>Inbound Notes</label>
  <textarea id="notes"></textarea>
</div>

</section>
<section class="card"><h2>Passengers, Bags, Assistance</h2>

<div class="pbaGrid pba7">
  <div><label class="req">Total Pax</label><input id="totalPax" maxlength="4" inputmode="numeric" class="num total requiredField" data-required></div>
  <div><label class="req">WCHR</label><input id="wchr" maxlength="4" inputmode="numeric" class="num requiredField" data-required></div>
  <div><label class="req">Conn Pax</label><input id="connPaxTotal" maxlength="4" inputmode="numeric" class="num total requiredField" data-required></div>
  <div><label class="req">Conn Bags</label><input id="connBagsTotal" maxlength="4" inputmode="numeric" class="num total requiredField" data-required></div>
  <div><label class="req">PETC</label><input id="petc" maxlength="4" inputmode="numeric" class="num requiredField" data-required></div>
</div>

<div class="pbaGrid pba7">
  <div><label>WCHC</label><input id="wchc" maxlength="4" inputmode="numeric" class="num" value="0"></div>
  <div><label>Total Bags</label><input id="totalBags" maxlength="4" inputmode="numeric" class="num"></div>
  <div><label>Missing Bags</label><input id="missingBags" maxlength="4" inputmode="numeric" class="num"></div>
  <div><label>Rush Bags</label><input id="rushBags" maxlength="4" inputmode="numeric" class="num"></div>
  <div><label>AVIH</label><input id="avih" maxlength="4" inputmode="numeric" class="num"></div>
  <div><label>SVIN</label><input id="svin" maxlength="4" inputmode="numeric" class="num"></div>
</div>

<div class="pbaGrid pba7">
  <div><label>F</label><input id="paxF" maxlength="4" inputmode="numeric" class="num"></div>
  <div><label>C/J</label><input id="paxJ" maxlength="4" inputmode="numeric" class="num"></div>
  <div><label>W</label><input id="paxW" maxlength="4" inputmode="numeric" class="num"></div>
  <div><label>M</label><input id="paxM" maxlength="4" inputmode="numeric" class="num"></div>
  <div><label>UM</label><input id="paxUM" maxlength="4" inputmode="numeric" class="num"></div>
  <div><label>Inf</label><input id="paxInf" maxlength="4" inputmode="numeric" class="num"></div>
  <div><label>Child</label><input id="paxChild" maxlength="4" inputmode="numeric" class="num"></div>
</div>

</section>
<section class="card"><h2>Connecting Flights</h2><div class="photoTools noPrint"><button type="button" class="secondary" data-action="addConnection">Add connecting flight</button></div><div id="connections"></div></section>
<section class="card"><h2>Optional Outbound Data</h2><div id="outbounds"></div><button type="button" class="secondary" data-action="addOutbound">Add outbound flight</button><div style="margin-top:8px"><label>Outbound Notes</label><textarea id="outboundNotes"></textarea></div></section>
<section class="card previewCard"><h2>Preview</h2><div id="preview"></div></section>
<section class="card noPrint"><h2>Saved Flights</h2><div id="saved"></div><div id="status" class="status"></div></section>
</form></main>
<div class="actions"><button type="button" data-action="save">Save Flight</button><button type="button" class="secondary" data-action="new">New Flight</button><button type="button" class="secondary" data-action="print">Print</button><button type="button" class="secondary" data-action="email">Email</button><button type="button" class="secondary" data-action="text">Text</button><button type="button" class="secondary" data-action="json">Export JSON</button><button type="button" class="secondary" data-action="csv">Export CSV</button></div>
<script>
(function(){

// v1.1.1: default airline from previous row
function copyPrevAirline(newRow){
  var rows = document.querySelectorAll('#connections .row');
  if(rows.length > 1){
    var prev = rows[rows.length-2].querySelector('[data-k="airline"]');
    var curr = newRow.querySelector('[data-k="airline"]');
    if(prev && curr) curr.value = prev.value;
  }
}

var KEY='pdxFlightData.crossPlatform.v1',currentId='';
var AIR=[['','Select'],['ASA','Alaska'],['BAW','British Airways'],['CFG','Condor'],['ICE','Icelandair'],['KLM','KLM'],['VOI','Volaris'],['SWA','Southwest'],['DAL','Delta'],['AAL','American']];
function el(id){return document.getElementById(id)}
function val(id){var x=el(id);return x?String(x.value||'').trim():''}
function set(id,v){var x=el(id);if(x)x.value=v||''}
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function pad(s,w){s=String(s==null?'':s);while(s.length<(w||4))s=' '+s;return s}
function airlinesHTML(){var h='';for(var i=0;i<AIR.length;i++)h+='<option value="'+AIR[i][0]+'">'+AIR[i][0]+'</option>';return h.replace('><','>Select<')}
function fillAirlines(root){var list=(root||document).querySelectorAll('[data-airline]');for(var i=0;i<list.length;i++)list[i].innerHTML=airlinesHTML()}
function rowHTML(){return '<div class="row"><div><label>Airline</label><select data-k="airline" data-airline></select></div><div><label>Flight No</label><input data-k="flightNo" maxlength="4" inputmode="numeric" class="num"></div><div><label>Dest</label><input data-k="dest" maxlength="3" autocapitalize="characters" style="text-transform:uppercase"></div><div><label>ETD</label><input data-k="etd" maxlength="4" inputmode="numeric" class="num"></div><div><label>Pax</label><input data-k="pax" maxlength="4" inputmode="numeric" class="num"></div><div><label>Bags</label><input data-k="bags" maxlength="4" inputmode="numeric" class="num"></div><div><label>Notes</label><input data-k="notes"></div><button type="button" class="danger" data-action="removeRow">Remove</button></div>'}
function addRow(containerId,data){var d=document.createElement('div');d.innerHTML=rowHTML();var row=d.firstChild;el(containerId).appendChild(row);fillAirlines(row);data=data||{};row.setAttribute('data-gate',data.gate||'');var ins=row.querySelectorAll('[data-k]');for(var i=0;i<ins.length;i++){var k=ins[i].getAttribute('data-k');ins[i].value=(k==='dest'?String(data[k]||'').toUpperCase():data[k]||'')}copyPrevAirline(row); return row}
function readRows(containerId){var rows=el(containerId).children,out=[];for(var i=0;i<rows.length;i++){var o={gate:rows[i].getAttribute('data-gate')||''},has=!!o.gate,ins=rows[i].querySelectorAll('[data-k]');for(var j=0;j<ins.length;j++){var k=ins[j].getAttribute('data-k'),v=String(ins[j].value||'').trim();if(k==='dest')v=v.toUpperCase();o[k]=v;if(v)has=true}if(has)out.push(o)}return out}
function totals(){var pax=n(val('paxF'))+n(val('paxJ'))+n(val('paxW'))+n(val('paxM'))+n(val('paxUM'))+n(val('paxChild'));if(!el('totalPax').getAttribute('data-manual') && !val('totalPax'))set('totalPax',pax||'');var c=readRows('connections'),cp=0,cb=0;for(var i=0;i<c.length;i++){cp+=n(c[i].pax);cb+=n(c[i].bags)}if(!el('connPaxTotal').getAttribute('data-manual'))set('connPaxTotal',cp||'');if(!el('connBagsTotal').getAttribute('data-manual'))set('connBagsTotal',cb||'')}
function record(){totals();return {id:currentId||('id-'+Date.now()),savedAt:new Date().toISOString(),inbound:{date:val('date'),submittedBy:val('submittedBy'),airline:val('airline'),flightNo:val('flightNo'),eta:val('eta'),tsaStatus:val('tsaStatus'),totalPax:val('totalPax'),totalBags:val('totalBags'),wchr:val('wchr'),wchc:val('wchc'),connPaxTotal:val('connPaxTotal'),connBagsTotal:val('connBagsTotal'),petc:val('petc'),avih:val('avih'),svin:val('svin'),pax:{F:val('paxF'),J:val('paxJ'),W:val('paxW'),M:val('paxM'),UM:val('paxUM'),Inf:val('paxInf'),Child:val('paxChild')},missingBags:val('missingBags'),rushBags:val('rushBags'),notes:val('notes'),connections:readRows('connections')},outbound:{flights:readRows('outbounds'),notes:val('outboundNotes')}}}
function fa(f){var id=(f.airline+f.flightNo).toUpperCase();return id?'https://www.flightaware.com/live/flight/'+encodeURIComponent(id):''}
function pair(a,b){return '<span class="previewPair"><span class="lbl">'+esc(a)+'</span><span class="val">'+esc(b||'0')+'</span></span>'}
function preview(){var r=record(),f=r.inbound,p=f.pax,h='<div class="previewKey">'+esc(f.airline)+' '+esc(f.flightNo)+' &nbsp; Date: '+esc(f.date)+' &nbsp; ETA: '+esc(fmtTime(f.eta))+'</div><div>TSA Status: <span class="badge '+(f.tsaStatus==='OPEN'?'open':f.tsaStatus==='CLOSED'?'closed':'')+'">'+esc(f.tsaStatus||'N/A')+'</span></div><div>Submitted By: <span class="badge">'+esc(f.submittedBy||'')+'</span></div>';h+='<h3>Passengers</h3><div class="previewLine tight">'+pair('Total Pax',f.totalPax)+pair('WCHR',f.wchr)+pair('WCHC',f.wchc)+pair('Conn Pax',f.connPaxTotal)+'</div><div class="previewLine">'+pair('F',p.F)+pair('C/J',p.J)+pair('W',p.W)+pair('M',p.M)+pair('UM',p.UM)+pair('Inf',p.Inf)+pair('Child',p.Child)+'</div>';h+='<h3>Bags</h3><div class="previewLine tight">'+pair('Total Bags',f.totalBags)+pair('Conn Bags',f.connBagsTotal)+pair('Missing Bags',f.missingBags)+pair('Rush Bags',f.rushBags)+'</div>';h+='<h3>Animals</h3><div class="previewLine tight">'+pair('PETC',f.petc)+pair('AVIH',f.avih)+pair('SVIN',f.svin)+'</div>';if(f.notes)h+='<p><b>Inbound Notes:</b> '+esc(f.notes)+'</p>';function table(t,arr){if(!arr.length)return '';var x='<h3>'+t+'</h3><table class="connTable"><tr><th>Airline</th><th class="num">Flight</th><th>Dest</th><th>Gate</th><th class="num">ETD</th><th class="num">Pax</th><th class="num">Bags</th><th>Notes</th></tr>';for(var i=0;i<arr.length;i++){var c=arr[i];x+='<tr><td>'+esc(c.airline)+'</td><td class="num">'+esc(c.flightNo)+'</td><td>'+esc(String(c.dest||'').toUpperCase())+'</td><td>'+esc(c.gate)+'</td><td class="num">'+esc(fmtTime(c.etd))+'</td><td class="num">'+esc(c.pax)+'</td><td class="num">'+esc(c.bags)+'</td><td>'+esc(c.notes)+'</td></tr>'}return x+'</table>'}h+=table('Connecting Flights',f.connections)+table('Outbound',r.outbound.flights);if(r.outbound.notes)h+='<p><b>Outbound Notes:</b> '+esc(r.outbound.notes)+'</p>';var link=fa(f);if(link)h+='<a class="flightAware" href="'+esc(link)+'" target="_blank">FlightAware: '+esc(f.airline+f.flightNo)+'</a>';h+='<div class="acronyms"><b>Acronyms</b><div class="acronymGrid"><div>F = First Class</div><div>WCHR = Wheelchair</div><div>C/J = Business</div><div>WCHC = Cabin Wheelchair</div><div>W = Premium Economy</div><div>PETC = Pet in Cabin</div><div>M = Economy</div><div>AVIH = Animal in Hold</div><div>UM = Unaccompanied Minor</div><div>SVIN = Service Animal</div></div></div>';el('preview').innerHTML=h}
function cell(v,w,right){v=String(v==null?'':v);if(v.length>w)v=v.slice(0,w);var sp=' '.repeat(Math.max(0,w-v.length));return right?sp+v:v+sp}
function row(cols){return cols.map(function(c){return cell(c[0],c[1],c[2])}).join('  ').replace(/\s+$/,'')}
function emailText(){
 var r=record(),f=r.inbound,p=f.pax,lines=[];
 lines.push((f.airline+' '+f.flightNo).trim()+'    Date: '+(f.date||'')+'    ETA: '+(f.eta||''));

 lines.push('Submitted By: '+(f.submittedBy||''));
 lines.push('');
 lines.push('PASSENGERS');
 lines.push(row([['Total Pax',9],['WCHR',5,true],['WCHC',5,true],['Conn Pax',8,true]]));
 lines.push(row([[f.totalPax,9,true],[f.wchr,5,true],[f.wchc,5,true],[f.connPaxTotal,8,true]]));
 lines.push(row([['F',4,true],['C/J',5,true],['W',4,true],['M',4,true],['UM',4,true],['Inf',5,true],['Child',6,true]]));
 lines.push(row([[p.F,4,true],[p.J,5,true],[p.W,4,true],[p.M,4,true],[p.UM,4,true],[p.Inf,5,true],[p.Child,6,true]]));
 lines.push('');
 lines.push('BAGS');
 lines.push(row([['Total Bags',10],['Conn Bags',9,true],['Missing Bags',12,true],['Rush Bags',9,true]]));

 lines.push('');
 lines.push('ANIMALS');
 lines.push(row([['PETC',5,true],['AVIH',5,true],['SVIN',5,true]]));

 if(f.notes){lines.push('');lines.push('Inbound Notes: '+f.notes)}
 if(f.connections.length){
   lines.push('');lines.push('CONNECTING FLIGHTS');
   lines.push(row([['Air',4],['Flt',5,true],['Dest',4],['Gate',5],['ETD',5,true],['Pax',4,true],['Bags',5,true],['Notes',20]]));
   for(var i=0;i<f.connections.length;i++){var c=f.connections[i];lines.push(row([[c.airline||'',4],[c.flightNo||'',5,true],[String(c.dest||'').toUpperCase(),4],[c.gate||'',5],[fmtTime(c.etd),5,true],[c.pax||'',4,true],[c.bags||'',5,true],[c.notes||'',20]]));}
 }
 if(r.outbound.flights.length){
